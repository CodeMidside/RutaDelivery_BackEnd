
spring.application.name=rutadelivery-backend

# =========================================
# SERVIDOR
# =========================================

server.address=0.0.0.0
server.port=${PORT:8080}


# =========================================
# MYSQL
#
# LOCAL:
# Si no existen variables de entorno,
# utilizará localhost:3306/rutadelivery_db.
#
# RAILWAY:
# Luego configuraremos DB_HOST, DB_PORT,
# DB_NAME, DB_USER y DB_PASSWORD.
# =========================================

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:rutadelivery_db}?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true

spring.datasource.username=${DB_USER:root}

spring.datasource.password=${DB_PASSWORD:}


# =========================================
# JPA / HIBERNATE
# =========================================

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=${SHOW_SQL:true}

spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect


# =========================================
# ERRORES
# =========================================

server.error.include-message=always
server.error.include-binding-errors=always


# =========================================
# GOOGLE ROUTES API
# =========================================

google.maps.routes.api-key=${GOOGLE_MAPS_ROUTES_API_KEY:}

google.maps.routes.url=https://routes.googleapis.com/directions/v2:computeRoutes


# =========================================
# ARCHIVOS / EVIDENCIAS
#
# LOCAL:
# uploads/evidencias
#
# RAILWAY:
# Luego usaremos /data/evidencias
# mediante un Volume persistente.
# =========================================

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

rutadelivery.archivos.directorio=${RUTADELIVERY_ARCHIVOS_DIRECTORIO:uploads/evidencias}


# =========================================
# JWT
# =========================================

rutadelivery.jwt.secret=${RUTADELIVERY_JWT_SECRET:}

rutadelivery.jwt.duracion-horas=${RUTADELIVERY_JWT_DURACION_HORAS:8}


# RECUPERACIÓN DE CONTRASEÑA / CORREO

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

rutadelivery.correo.remitente=${MAIL_FROM:${MAIL_USERNAME:}}

# =========================================
# GOOGLE LOGIN
# =========================================

rutadelivery.google.web-client-id=${GOOGLE_WEB_CLIENT_ID:}
